# =============================================================================
# gnome-topbar Configuration
# =============================================================================
#
# Minimal starter config. User configuration lives at:
# ~/.config/gnome-topbar/config.toml
#
# Commands:
#   gnome-topbar --check-config         Validate configuration
#   gnome-topbar --print-example-config Print this example config
#
# =============================================================================

[bar]
position = "top"         # "top" or "bottom"
size = 36
spacing = 2
screen_margin = 0
inset = 4
padding = 0
border_radius = 0
background_color = "#000000"
background_opacity = 1.0 # GNOME Shell-style continuous top panel
# outline = true         # Override theme.outline for the bar (omit = inherit)

[widgets]
left = ["workspaces"]
center = ["clock"]
right = [
  "tray",
  "quick_settings",
]
border_radius = 50
background_opacity = 0.0
# popover_background_opacity = 0.9  # Override popover opacity (default: max of bar and widget opacity)
# outline = true                    # Override theme.outline for widgets (omit = inherit)

# Per-widget options use [widgets.<name>] sections.
# Example:
#   [widgets.clock]
#   format = "%H:%M"
#   outline_color = "accent"  # Per-widget outline color: "subtle" | "accent" | "foreground" | "#rrggbb"
#
#   [widgets.battery]
#   disabled = true
#
#   [widgets.media]
#   visualizer = true  # Enable/disable cava audio visualizer (default: true)
#
#   [widgets.updates]
#   # Disabled until configured. Command may print a number or one update per line.
#   update_count_command = ""
#
#   [widgets.notifications]
#   hide_empty = true
#   control_panel = true
#
# Custom widgets use the "custom-" prefix for user-defined buttons:
#   right = ["custom-power", "custom-os", "tray", "clock"]
#
#   [widgets.custom-power]
#   icon = "system-shutdown-symbolic"
#   label = "Power"
#   tooltip = "Power menu"
#   on_click = "wlogout"
#   on_click_right = "systemctl suspend"
#
#   [widgets.custom-os]
#   image = "/usr/share/pixmaps/distro-logo.svg"  # file path (PNG, SVG, etc.)
#   tooltip = "My Distro"
#
# Native weather can auto-place next to the clock and also feeds the control panel:
#   [widgets.weather]
#   disabled = false
#   exec = "curl -s 'wttr.in/?format=1'"
#   interval = 600
#   position = "left" # "left" or "right" of the clock
#   tooltip = "Weather"
#   max_chars = 30
#
# Native headset uses the same script output contract as custom widgets:
#   [widgets.headset]
#   exec = "headsetcontrol -bc"
#   interval = 5
#   tooltip = "Headset battery"
#
# See documentation for all widget options.

[theme]
mode = "dark" # "auto", "dark", "light", "gtk"
#               "auto" = wallpaper-adaptive theming
#               (detects from hyprpaper, awww/swww, wpaperd, waypaper)
#scheme = "dark"         # Material You polarity: "dark" or "light" (auto mode only)
#               Omit to auto-derive from wallpaper luminance (bright → light, dark → dark)
#wallpaper = "/path/to/image.png"  # Explicit wallpaper for auto mode (default: auto-detect)
accent = "#3584e4" # GNOME blue; use "gtk", "none", or a hex color
#animations = true  # Enable/disable all CSS transitions and animations
#ripple = true      # Enable/disable Material Design ripple effect on click
#blur = false       # Enable compositor blur via ext-background-effect-v1 (requires niri with blur)
#outline = false             # Decorative outline on bar, widgets, and surfaces (CSS border)
#outline_width = 1           # Outline width in pixels (0..=4; 0 disables visibly)
#outline_color = "accent"    # "subtle" | "accent" | "foreground" | "#rrggbb"
#outline_opacity = 1.0        # 0.0 = transparent, 1.0 = opaque

[theme.icons]
theme = "Adwaita"  # "material", "gtk", or a named GTK icon theme
weight = 400       # Material icon stroke weight (100-700)

[theme.typography]
font_family = "Adwaita Sans, Cantarell, Noto Sans, sans-serif"

[widgets.clock]
format = "%a %b %-d  %H:%M"
control_panel = true
media_thumbnail = false # Compact bar companion album art beside the clock.
media_eq = true         # Pulse the compact bar play/pause button while playing.

[osd]
enabled = true
position = "bottom" # "bottom", "top", "left", "right"
show_value = false  # Show current value after the bar

[audio]
# Allow output and microphone volume over 100% (over-amplification), capped at PulseAudio's recommended UI max.
allow_overdrive = false

[advanced]
# compositor = "auto"  # "auto", "hyprland", "niri", "mango"

# Custom CSS: place style.css in same directory as this file.
# See documentation for available CSS variables and classes.
