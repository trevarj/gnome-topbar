[package]
name = "gnome-topbar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GNOME Shell-inspired GTK top panel for Wayland"

[[bin]]
name = "gnome-topbar"
path = "src/main.rs"

[dependencies]
gnome-topbar-core = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
gtk4 = { workspace = true }
pango = { workspace = true }
gtk4-layer-shell = { workspace = true }
gdk4-wayland = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libpulse-binding = { workspace = true }
libc = { workspace = true }
udev = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
minreq = { workspace = true }
material-colors = { workspace = true }

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = [
    "precommit-hook",
    "run-for-all",
    "run-cargo-test",
    "run-cargo-clippy",
    "run-cargo-fmt",
] }
