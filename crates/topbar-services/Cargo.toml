[package]
name = "topbar-services"
description = "Async system services (D-Bus, niri, audio) for topbar; never depends on GTK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Builds the `topbar-fake-player` test-support binary and the module behind
# it. Never enabled for the packaged panel; the visual smoke run turns it on
# to put players on its private bus.
fake-player = []
# The same arrangement for the tray: `topbar-fake-sni` puts a
# StatusNotifierItem with a real dbusmenu on the smoke run's private bus.
fake-sni = []
# And for power: `topbar-fake-power` serves a UPower and a power-profiles
# daemon, because the real ones live on the *system* bus and a smoke run must
# never so much as look at that.
fake-power = []

[[bin]]
name = "topbar-fake-player"
path = "src/bin/fake_player.rs"
required-features = ["fake-player"]

[[bin]]
name = "topbar-fake-sni"
path = "src/bin/fake_sni.rs"
required-features = ["fake-sni"]

[[bin]]
name = "topbar-fake-power"
path = "src/bin/fake_power.rs"
required-features = ["fake-power"]

[dependencies]
topbar-core = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
libpulse-binding = { workspace = true }
minreq = { workspace = true }
niri-ipc = { workspace = true }
udev = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }
