[workspace]
resolver = "2"
members = [
    "crates/gnome-panel",
    "crates/gnome-panel-core",
]

[workspace.package]
version = "0.14.1"
edition = "2024"
license = "MIT"
authors = ["GNOME Panel contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# GTK4 and Wayland
gtk4 = { version = "0.10", features = ["v4_12"] }
pango = { version = "0.21", features = ["v1_56"] }
gtk4-layer-shell = "0.7"
gdk4-wayland = { version = "0.10", default-features = false, features = ["wayland_crate"] }
wayland-client = { version = "0.31", default-features = false }
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }
wayland-scanner = "0.31"

# File watching
notify = { version = "6.1", default-features = false, features = ["crossbeam-channel"] }

# Hashing
sha2 = "0.10"

# Audio
libpulse-binding = "2.28"

# System
libc = "0.2"
udev = "0.9"
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "component"] }
nvml-wrapper = "0.12"

# Synchronization
parking_lot = "0.12"

# HTTP
minreq = { version = "2.14", default-features = false, features = ["https-rustls"] }

# Color extraction
material-colors = { version = "0.4.2" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Internal crates
gnome-panel-core = { path = "crates/gnome-panel-core" }
