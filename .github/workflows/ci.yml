name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Guix Checks
    steps:
      - uses: actions/checkout@v4
      - uses: PromyLOPh/guix-install-action@v1
      - name: Formatting
        run: |
          guix shell -m manifest.scm -- sh -c \
            'export LD_LIBRARY_PATH=$LIBRARY_PATH; cargo fmt --all -- --check'
      - name: Clippy
        run: |
          guix shell -m manifest.scm -- sh -c \
            'export LD_LIBRARY_PATH=$LIBRARY_PATH; cargo clippy --workspace --all-targets -- -D warnings'
      - name: Tests
        run: |
          guix shell -m manifest.scm -- sh -c \
            'export LD_LIBRARY_PATH=$LIBRARY_PATH; cargo test --workspace --all-targets'
      - name: Font subset manifest
        run: guix shell -m manifest.scm -- ./scripts/subset-font.sh --check
      - name: Guix package dry run
        run: guix build -f guix/gnome-topbar.scm --dry-run
