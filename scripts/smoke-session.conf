<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Bus configuration for the nested-niri smoke test.

  Identical to a stock session bus but for one omission: there is no
  <standard_session_servicedirs/>, so nothing on this bus is activatable.

  That omission is the point. GTK asks org.freedesktop.host.portal.Registry
  for its version while opening the display, and on a stock configuration the
  bus dutifully tries to *start* a portal, which then fails because there is no
  session behind it — leaving GTK blocked on a call that will not be answered
  until the D-Bus timeout, which is longer than the whole smoke run. With
  nothing activatable the call fails immediately with ServiceUnknown, GTK
  shrugs, and the panel comes up.
-->
<busconfig>
  <type>session</type>

  <listen>unix:tmpdir=/tmp</listen>

  <policy context="default">
    <!-- A private bus with one panel and one test script on it: everything is
         allowed, including BecomeMonitor so `gdbus monitor` can watch the
         notification signals the run is there to check. -->
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
    <allow user="*"/>
  </policy>
</busconfig>
